name: CI - Gerar PDF Curriculo

on:
  push:
    branches: [ main ]
    paths:
      - 'dados_curriculo.json'
      - 'gerar_pdf.py'
      - 'DejaVuSans.ttf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify font present
        run: |
          if [ ! -f DejaVuSans.ttf ]; then
            echo "DejaVuSans.ttf not found in repo root" >&2
            exit 1
          fi
          ls -l DejaVuSans.ttf

      - name: Generate PDF
        run: |
          python gerar_pdf.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curriculo_pdf
          path: curriculo_fabiano.pdf

      - name: Commit generated PDF back to repo (optional)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only add and commit if file changed
          git add curriculo_fabiano.pdf || true
          if ! git diff --cached --quiet; then
            git commit -m "CI: update generated curriculo_fabiano.pdf" || true
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
