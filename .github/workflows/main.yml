name: CI - Atualizar Currículo

on:
  push:
    branches:
      - main
    paths:
      - "dados_curriculo.json"
      - "gerar_pdf.py"
      - "atualizar_readme.py"
      - "DejaVuSans.ttf"
      - "requirements.txt"
      - ".github/workflows/main.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar README e PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar JSON
        run: |
          python -m json.tool dados_curriculo.json > /dev/null
          echo "JSON válido."

      - name: Verificar arquivos necessários
        run: |
          test -f dados_curriculo.json
          test -f gerar_pdf.py
          test -f atualizar_readme.py
          test -f DejaVuSans.ttf

          echo "Todos os arquivos necessários estão presentes."

      - name: Gerar README
        run: |
          python atualizar_readme.py

      - name: Gerar currículo PDF
        run: |
          python gerar_pdf.py

      - name: Verificar arquivos gerados
        run: |
          test -s README.md
          test -s curriculo_fabiano.pdf

          echo "README.md:"
          ls -lh README.md

          echo "curriculo_fabiano.pdf:"
          ls -lh curriculo_fabiano.pdf

      - name: Upload do PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: curriculo-fabiano-pdf
          path: curriculo_fabiano.pdf
          if-no-files-found: error

      - name: Commit arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md curriculo_fabiano.pdf

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos gerados."
            exit 0
          fi

          git commit -m "CI: atualizar currículo PDF e README"
          git push origin HEAD:main
